[workspace]
resolver = "2"
members = ["crates/uwusweep-core", "apps/desktop/src-tauri", "apps/setup/src-tauri"]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/MinifyX/UwUSweep"
rust-version = "1.89"

[workspace.dependencies]
uwusweep-core = { path = "crates/uwusweep-core" }

anyhow = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process"] }
tracing = "0.1"
walkdir = "2"

[profile.dev]
opt-level = 1
# Line tables are enough for backtraces, and keep target/ small and linking
# fast.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
