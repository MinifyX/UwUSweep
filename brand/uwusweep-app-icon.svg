    tilted on the pastel pink tile (#FFF3F8 to #FFD3E5), props arranged
    differently for each app. Here: the broom leans in from the right and
    sweeps three dust puffs towards her, a big star top left, a small one
    bottom left. Platform icons: node scripts/icons.mjs
  -->
